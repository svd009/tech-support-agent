services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - support-data:/app/data
volumes:
  support-data:

