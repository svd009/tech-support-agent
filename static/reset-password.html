<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account recovery | Support Desk</title><link rel="stylesheet" href="/static/app.css"><script src="/static/reset-password.js" defer></script></head><body><main class="login-side" style="min-height:100vh"><form id="reset-form" class="login-card"><h2 id="heading">Forgot password?</h2><p id="help">Enter your employee ID to request account recovery. IT support will verify your identity before providing a reset link. You do not need your old password.</p><div id="employee-row"><label for="employee">Employee ID</label><input id="employee" autocomplete="username" required maxlength="100"></div><div id="current-row" hidden><label for="current">Current password</label><input id="current" type="password" autocomplete="current-password" maxlength="256"></div><div id="new-fields" hidden><label for="next">New password (12–256 characters)</label><input id="next" type="password" autocomplete="new-password" minlength="12" maxlength="256"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256"></div><button id="submit" class="primary">Request recovery</button><p id="result" role="status"></p><p><a id="mode-link" href="/reset-password?mode=change">Know your password? Change it here</a></p><a href="/">Back to sign in</a></form></main></body></html>
